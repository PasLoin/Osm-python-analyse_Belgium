name: "Stations Cambio - Bruxelles vs OSM"

on:
  workflow_dispatch:
    inputs:
      match_threshold_m:
        description: "Seuil d'appariement spatial (metres)"
        required: false
        default: "100"
        type: string

permissions:
  contents: read

jobs:
  compare:
    name: "Comparaison Cambio vs OSM"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: "Checkout du depot (LFS active)"
        uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 1

      - name: "Telechargement du PBF (release daily)"
        run: |
          mkdir -p pbf_analyse/history
          curl -fL --retry 3 --retry-delay 10 \
            -o pbf_analyse/history/Brussels-daily.pbf \
            "https://github.com/PasLoin/Osm-python-analyse_Belgium/releases/download/daily/Brussels-daily.pbf"
          ls -lh pbf_analyse/history/Brussels-daily.pbf

      - name: "Mise en place de Python 3.12"
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: "Installation des dependances Python"
        run: |
          pip install --upgrade pip
          pip install -r requirements/compare.txt

      - name: "Comparaison Cambio vs OSM"
        env:
          MATCH_THRESHOLD_M: ${{ inputs.match_threshold_m }}
        run: |
          python amenity/cambio-brussels-opendata-compare-osm.py

      - name: "Upload des rapports (artefacts)"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: "cambio-stations-report-${{ github.run_number }}"
          path: |
            amenity/report_cambio_stations.txt
            amenity/report_cambio_stations.json
            amenity/missing_in_osm.geojson
            amenity/missing_in_opendata.geojson
            amenity/tag_issues.geojson
          retention-days: 90
