name: Brussels PBF to Parquet

on:
  workflow_run:
    workflows:
      - "Daily Brussels PBF Extract (SliceOSM)"
      - "Backup Brussels PBF (OSM-FR + diffs minute)"
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: brussels-pbf-to-parquet
  cancel-in-progress: false

jobs:
  convert:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Trigger
        run: |
          echo "Déclencheur : ${{ github.event_name }} ${{ github.event.workflow_run.name }}"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install QuackOSM
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/parquet.txt

      - name: Convert PBF to GeoParquet
        run: python parquet/convert_to_parquet.py

      - name: Publish to release "daily"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/publish_release.sh daily "Brussels daily extracts" \
            parquet/Brussels-daily.quackosm.parquet

      - name: Remove legacy Parquet asset from release "daily"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete-asset daily brussels-latest.parquet --yes && echo "Supprimé : brussels-latest.parquet" || echo "Absent : brussels-latest.parquet"

      - name: Update release "daily" description
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit daily --notes-file .github/release-notes/daily.md
