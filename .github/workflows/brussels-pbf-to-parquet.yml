name: Brussels PBF to Parquet

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: brussels-pbf-to-parquet
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install QuackOSM
        run: |
          python -m pip install --upgrade pip
          pip install quackosm "duckdb==1.5.6"
              

      - name: Convert PBF to GeoParquet
        run: python parquet/convert_to_parquet.py

      - name: Publish to release "daily"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/publish_release.sh daily "Brussels daily extracts" \
            parquet/brussels-latest.parquet
