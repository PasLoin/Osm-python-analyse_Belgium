name: Dependency report

on:
  workflow_dispatch:
  schedule:
    - cron: "18 5 17 * *"
  pull_request:
    paths:
      - "requirements*.txt"
      - "requirements/**"
      - ".github/workflows/**"
      - ".github/scripts/check_dependencies.py"

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build dependency report
        run: python .github/scripts/check_dependencies.py .
