name: Backup Brussels PBF (OSM-FR + diffs minute)

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: brussels-daily-pbf
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          pip install -r requirements/pbf.txt

      - name: Base OSM-FR + application des diffs minute + clip
        run: python pbf_analyse/backup_osmfr_minutely.py

      - name: Generate history-list.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: python pbf_analyse/generate_history_list.py

      - name: Publish to release "daily"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/publish_release.sh daily "Brussels daily extracts" \
            pbf_analyse/history/Brussels-daily.pbf \
            pbf_analyse/history/state.txt

      - name: Remove legacy OSM-FR assets from release "daily"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for a in osmfr_brussels_capital_region-latest.osm.pbf osmfr_brussels_capital_region.state.txt; do
            gh release delete-asset daily "$a" --yes && echo "Supprimé : $a" || echo "Absent : $a"
          done

      - name: Commit & push metadata
        run: |
          git config user.name  "actions-user"
          git config user.email "actions@github.com"
          git add pbf_analyse/history/state.txt pbf_analyse/history-list.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Backup Brussels PBF (OSM-FR + minutely) – $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin main
          git push
