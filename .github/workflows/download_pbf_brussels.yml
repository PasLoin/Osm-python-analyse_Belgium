name: Download_pbf_Brussels

on:
  schedule:
    - cron: "0 2 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  
env:
  ACTIONS_ALLOW_UNSECURE_COMMANDS: true

jobs:
  scrape-latest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests==2.27.1
      - name: Set Git configurations
        run: |
          git config --global user.name "actions-user"
          git config --global user.email "actions@github.com"
      - name: Save downloaded PBF file to repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python pbf_analyse/download_pbf_brussels.py
          git add pbf_analyse/history/*.pbf
          mapfile -t changed < <(git diff --cached --name-only -- 'pbf_analyse/history/*_brussels_capital_region.pbf')
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Downloaded Brussels PBF data"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
          if [ "${#changed[@]}" -gt 0 ]; then
            bash .github/scripts/publish_release.sh history "Brussels historical snapshots" "${changed[@]}"
          fi
