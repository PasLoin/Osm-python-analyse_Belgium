name: Download_pbf_Brussels

on:
  schedule:
    - cron: "0 2 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brussels-daily-pbf
  cancel-in-progress: false

jobs:
  scrape-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Download monthly snapshot
        run: python pbf_analyse/download_pbf_brussels.py

      - name: Publish to release "history"
        run: |
          bash .github/scripts/publish_release.sh history "Brussels historical snapshots" \
            pbf_analyse/history/*_brussels_capital_region.pbf

      - name: Generate history-list.json
        run: python pbf_analyse/generate_history_list.py

      - name: Commit & push metadata
        run: |
          git config user.name  "actions-user"
          git config user.email "actions@github.com"
          git add pbf_analyse/history-list.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Monthly Brussels snapshot – $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin main
          git push
